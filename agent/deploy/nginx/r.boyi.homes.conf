# Customer share links: only /r/ reaches the read-only share service on 8766.
# Nothing here proxies to the Console (8765) or the Agent (9000).
limit_req_zone $binary_remote_addr zone=boyi_share:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name r.boyi.homes;

    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://r.boyi.homes$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name r.boyi.homes;

    server_tokens off;
    client_max_body_size 4k;
    ssl_certificate /etc/letsencrypt/live/r.boyi.homes/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/r.boyi.homes/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:boyi_share_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Link codes are part of the path: keep them out of the access log.
    access_log off;

    location ^~ /r/ {
        limit_req zone=boyi_share burst=60 nodelay;
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # The service trusts only this header for the client address.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
