# Include this file exactly once inside the boyi.homes HTTPS server block.
# Per-location client certificate requirements are implemented with optional
# server-level verification plus an exact SUCCESS gate below. Ordinary routes
# remain available to clients that do not present a certificate.

ssl_client_certificate /etc/nginx/mtls/boyi-worker-client-ca.pem;
ssl_verify_client optional;
ssl_verify_depth 3;

location ^~ /internal/v1/automation/worker/ {
    if ($ssl_client_verify != SUCCESS) {
        return 403;
    }

    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_request_buffering on;
    proxy_pass http://127.0.0.1:9000;

    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # These headers are overwritten from Nginx TLS state. Client-supplied
    # values can select a device row but can never establish its identity.
    proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
    proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
    proxy_set_header X-Worker-Device-ID $http_x_worker_device_id;

    # Worker transport is mTLS/Ed25519-authenticated and must never inherit
    # the ordinary internal-token or signed Console principal boundary.
    proxy_set_header X-Agent-Internal-Token "";
    proxy_set_header X-Console-Principal "";
    proxy_set_header X-Console-Timestamp "";
    proxy_set_header X-Console-Nonce "";
    proxy_set_header X-Console-Signature "";
    proxy_set_header X-Agent-Execution-Capability "";
    proxy_set_header X-Agent-Webhook-Token "";
}
