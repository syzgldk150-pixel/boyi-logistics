limit_req_zone $binary_remote_addr zone=boyi_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name boyi.homes www.boyi.homes;

    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://boyi.homes$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.boyi.homes;

    server_tokens off;
    # Console accepts a 32 MiB signed ZIP; leave room for multipart framing.
    client_max_body_size 34m;
    ssl_certificate /etc/letsencrypt/live/boyi.homes/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/boyi.homes/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:boyi_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    proxy_connect_timeout 30s;
    proxy_send_timeout 7200s;
    proxy_read_timeout 7200s;

    location ^~ /original/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        return 301 https://boyi.homes$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name boyi.homes;

    server_tokens off;
    # Console accepts a 32 MiB signed ZIP; leave room for multipart framing.
    client_max_body_size 34m;

    ssl_certificate /etc/letsencrypt/live/boyi.homes/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/boyi.homes/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:boyi_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    proxy_connect_timeout 30s;
    proxy_send_timeout 7200s;
    proxy_read_timeout 7200s;

    location = /login {
        limit_req zone=boyi_login burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /monitoring/stream {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering "no" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
