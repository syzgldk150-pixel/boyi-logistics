<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>客服自动回复设置</title><link rel="stylesheet" href="settings.css"></head><body><main class="settings-page"><header class="settings-intro"><h1>客服自动回复设置</h1><p>选择运行账号与每轮处理数量。只有在客户服务“处理模板”里授权了自动处理的模板才会自动回复。</p></header><form data-settings-form><section class="settings-section"><h2>业务参数</h2><p>每轮最多尝试的问题件数留空时为 5。</p><div class="settings-grid" data-config-fields></div></section><section class="settings-section"><h2>运行账号</h2><p>只显示脱敏账号和当前登录状态。</p><div class="settings-grid" data-account-fields></div></section><section class="settings-section"><h2>飞书资源</h2><div class="settings-grid" data-resource-fields></div></section><div class="settings-actions"><button type="button" data-save-settings disabled>保存插件设置</button><span class="settings-feedback" data-settings-feedback role="status" aria-live="polite">正在连接…</span></div></form></main><script src="settings.js"></script></body></html>
