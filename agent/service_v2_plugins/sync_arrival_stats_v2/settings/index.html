<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>到货统计设置</title><link rel="stylesheet" href="settings.css"></head><body><main class="settings-page"><header class="settings-intro"><h1>到货统计设置</h1><p>配置统计范围、运行账号和各业务工作表。定时计划由自动化卡片单独保存。</p></header><form data-settings-form><section class="settings-section"><h2>统计规则</h2><p>业务日期留空时由受管运行环境按任务合同处理。</p><div class="settings-grid" data-config-fields></div></section><section class="settings-section"><h2>运行账号</h2><p>只显示脱敏账号和当前登录状态。</p><div class="settings-grid" data-account-fields></div></section><section class="settings-section"><h2>业务工作表</h2><p>每个用途独立绑定，单张表异常不会清空其他选择。</p><div class="settings-grid" data-resource-fields></div></section><div class="settings-actions"><button type="button" data-save-settings disabled>保存插件设置</button><span class="settings-feedback" data-settings-feedback role="status" aria-live="polite">正在连接…</span></div></form></main><script src="settings.js"></script></body></html>
