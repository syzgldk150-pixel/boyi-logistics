<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>扫描同步设置</title><link rel="stylesheet" href="settings.css"></head><body><main class="settings-page"><header class="settings-intro"><h1>扫描同步设置</h1><p>设置读取上限、批次与运行账号。执行、取消和输出仍由 Console 统一管理。</p></header><form data-settings-form><section class="settings-section"><h2>扫描规则</h2><p>限制单次处理规模，避免任务无限扩张。</p><div class="settings-grid" data-config-fields></div></section><section class="settings-section"><h2>运行账号</h2><p>只显示脱敏账号和当前登录状态。</p><div class="settings-grid" data-account-fields></div></section><section class="settings-section"><h2>飞书资源</h2><div class="settings-grid" data-resource-fields></div></section><div class="settings-actions"><button type="button" data-save-settings disabled>保存插件设置</button><span class="settings-feedback" data-settings-feedback role="status" aria-live="polite">正在连接…</span></div></form></main><script src="settings.js"></script></body></html>
