<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自提问题件设置</title><link rel="stylesheet" href="settings.css"></head><body><main class="settings-page"><header class="settings-intro"><h1>自提问题件设置</h1><p>绑定自提货物来源表与两个业务账号。候选预览和写入确认由 Console 执行流程负责。</p></header><form data-settings-form><section class="settings-section"><h2>处理规则</h2><p>设置本实例筛选范围。</p><div class="settings-grid" data-config-fields></div></section><section class="settings-section"><h2>业务账号</h2><p>只显示脱敏账号和当前登录状态。</p><div class="settings-grid" data-account-fields></div></section><section class="settings-section"><h2>自提货物来源</h2><p>选择飞书当前真实表格位置。</p><div class="settings-grid" data-resource-fields></div></section><div class="settings-actions"><button type="button" data-save-settings disabled>保存插件设置</button><span class="settings-feedback" data-settings-feedback role="status" aria-live="polite">正在连接…</span></div></form></main><script src="settings.js"></script></body></html>
