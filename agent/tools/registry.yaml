tools:
  - name: query_waybill
    version: "1.0.0"
    operation_type: read
    risk_level: low
    llm_exposed: true
    approval:
      mode: none
    permissions:
      required_roles:
        - admin
    account_scope:
      required: false
      allow_implicit_default: false
    idempotency:
      mode: parameters
      key_fields: []
    retry:
      safe: true
      max_attempts: 3
    evidence:
      required: true
      required_fields:
        - source
        - observed_at
    postconditions:
      - authoritative_result_returned
    description: "根据运单号查询运单签收状态或详细信息（收件人、地址、件数、重量等）"
    input_schema:
      type: object
      additionalProperties: false
      properties:
        waybill_no:
          type: string
          description: "运单号，支持多个用逗号/空格分隔，如 YS20260401001,YS20260401002"
        query_type:
          type: string
          enum: [status, detail]
          description: "查询类型：status=签收状态速查（默认，支持批量），detail=完整运单详情（仅单号）"
      required: [waybill_no]
    output_schema:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [SUCCESS, FAILED]
        data:
          type: object
          additionalProperties: true
        meta:
          type: object
          additionalProperties: true
        warnings:
          type: array
          items:
            type: string
        error:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
      required: [status, data, meta, warnings, error]
    executor: tools/query_tool.py
    timeout: 70
    heavy: false

