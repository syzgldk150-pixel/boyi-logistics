          additionalProperties: true
        warnings:
          type: array
          items:
            type: string
        error:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
      required: [status, data, meta, warnings, error]
    executor: tools/customer_service_problem_publish_tool.py
    timeout: 180
    heavy: false

