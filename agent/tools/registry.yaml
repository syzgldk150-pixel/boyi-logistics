  - name: feishu_operation
    version: "1.0.0"
    operation_type: destructive
    risk_level: extreme
    llm_exposed: false
    approval:
      mode: disabled
    permissions:
      required_roles:
        - super_admin
    account_scope:
      required: false
      allow_implicit_default: false
