    heavy: true

  - name: sync_daily_send_orders
    version: "1.0.0"
    operation_type: internal_projection_write
    risk_level: medium
    llm_exposed: false
    approval:
      mode: schedule_allowlist
      required_role: admin
    permissions:
      required_roles:
        - admin
    account_scope:
      required: false
      allow_implicit_default: false
    idempotency:
      mode: none
      key_fields: []
    retry:
      safe: false
      max_attempts: 1
    evidence:
      required: true
      required_fields:
        - source
        - observed_at
        - execution_result
    postconditions:
      - executor_reported_success
    description: "Phase 7 第一批：拉取融辉寄件数据并按发件日期替换写入飞书多维表格"
    input_schema:
      type: object
      additionalProperties: false
      properties:
        target_date:
          type: string
          description: "可选，单个发件日期，格式 YYYY-MM-DD；默认当天"
        start_date:
          type: string
          description: "可选，范围拉取起始发件日期，格式 YYYY-MM-DD；与 end_date 组成闭区间"
        end_date:
          type: string
          description: "可选，范围拉取结束发件日期，格式 YYYY-MM-DD；与 start_date 组成闭区间"
        request_body:
          type: object
          description: "可选，覆盖默认 send_order 请求体"
        page_size:
          type: integer
          description: "融辉寄件列表接口每页条数，默认 100"
        max_pages:
          type: integer
          description: "最多拉取页数，默认 50"
        base_token:
          type: string
          description: "可选，飞书多维表格 app/base token；默认从 Agent MySQL 中读取，必要时可由 N8N 只读导入"
        table_id:
          type: string
          description: "可选，飞书多维表格 table_id；默认从 Agent MySQL 中读取，必要时可由 N8N 只读导入"
        dry_run:
          type: boolean
          description: "仅演练，不写入或删除飞书记录"
        sql_only:
          type: boolean
          description: "仅同步控制台 waybills SQL 表，不写入或删除飞书记录"
        sync_sql:
          type: boolean
          description: "是否同步控制台 waybills SQL 表，默认 true"
      required: []
    output_schema:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [SUCCESS, FAILED]
        data:
          type: object
          additionalProperties: true
        meta:
          type: object
          additionalProperties: true
        warnings:
          type: array
          items:
            type: string
        error:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
      required: [status, data, meta, warnings, error]
    executor: tools/send_order_sync_tool.py
    timeout: 7200
    heavy: false

  - name: sync_delivery_status
    version: "1.0.0"
    operation_type: internal_projection_write
    risk_level: medium
    llm_exposed: false
    approval:
      mode: schedule_allowlist
      required_role: admin
    permissions:
      required_roles:
        - admin
    account_scope:
      required: false
      allow_implicit_default: false
    idempotency:
      mode: none
      key_fields: []
    retry:
      safe: false
      max_attempts: 1
    evidence:
      required: true
      required_fields:
        - source
        - observed_at
        - execution_result
    postconditions:
      - executor_reported_success
    description: "Phase 7 第一批：扫描飞书多维表格未签收记录，查询签收状态并批量更新；也兼容传入单号和 record_id 的 webhook 模式"
    input_schema:
      type: object
      additionalProperties: false
      properties:
        bill_codes:
          type: array
          items:
            type: string
          description: "运单号列表"
        record_ids:
          type: array
          items:
            type: string
          description: "与 bill_codes 一一对应的飞书 record_id 列表"
        BILL_CODE:
          type: string
          description: "兼容 N8N webhook 查询参数：逗号分隔运单号"
        RECORD_ID:
          type: string
          description: "兼容 N8N webhook 查询参数：逗号分隔 record_id"
        base_token:
          type: string
          description: "可选，飞书多维表格 app/base token；默认从 Agent MySQL 中读取，必要时可由 N8N 只读导入"
        table_id:
          type: string
          description: "可选，飞书多维表格 table_id；默认从 Agent MySQL 中读取，必要时可由 N8N 只读导入"
        view_id:
          type: string
          description: "可选，飞书多维表格 view_id；未传时优先按 view_name 解析"
        view_name:
          type: string
          description: "可选，飞书多维表格视图名称；默认 未签收明细，只扫描该视图中的候选记录"
        list_limit:
          type: integer
          description: "可选，每页读取飞书记录数，默认 200；飞书多维表格列表接口单页上限按 200 处理"
        query_batch_size:
          type: integer
          description: "可选，每批查询签收状态的运单数，默认 100"
        dry_run:
          type: boolean
          description: "仅演练，不写回飞书记录"
      required: []
    output_schema:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [SUCCESS, FAILED]
        data:
          type: object
          additionalProperties: true
        meta:
          type: object
          additionalProperties: true
        warnings:
          type: array
          items:
            type: string
        error:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
      required: [status, data, meta, warnings, error]
    executor: tools/delivery_status_sync_tool.py
    timeout: 1800
    heavy: false

  - name: sync_daily_should_sign
    version: "2.0.0"
    operation_type: internal_projection_write
    risk_level: medium
    llm_exposed: false
    approval:
      mode: schedule_allowlist
      required_role: admin
    permissions:
      required_roles:
        - admin
    account_scope:
      required: false
      allow_implicit_default: false
    idempotency:
      mode: parameters
      key_fields: []
    retry:
      safe: false
      max_attempts: 1
    evidence:
      required: true
      required_fields:
        - pagination_complete
        - account
        - source
        - observed_at
    postconditions:
      - authoritative_snapshot_committed
    description: "权威每日应签采集：完整读取 R13、到货快照、融辉问题件与主单签收证据，提交 MySQL 账本并影子投影"
    input_schema:
      type: object
      additionalProperties: false
      properties:
        request_body:
          type: object
          description: "可选，仅允许覆盖 get_qianshou 的非凭据查询参数；账号必须由 r13_account_id 经账号管理器显式绑定"
        base_token:
          type: string
          description: "可选，覆盖 phase7.daily_sign_bitable 的 base_token"
        table_id:
          type: string
          description: "可选，覆盖 phase7.daily_sign_bitable 的 table_id"
        spreadsheet_token:
          type: string
          description: "可选，覆盖 phase7.daily_sign_sheet 的 spreadsheet_token"
        range:
          type: string
          description: "可选，覆盖 phase7.daily_sign_sheet 的写入范围"
        enrich_addresses:
          type: boolean
          description: "是否按运单号调用 query_waybill_detail 补齐脱敏收件地址，默认 true"
        detail_account_id:
          type: string
          minLength: 1
          description: "必填，补齐地址时使用的融辉详情查询账号 ID"
        r13_account_id:
          type: string
          minLength: 1
          description: "必填，每日应签 R13 查询账号 ID"
        problem_account_id:
          type: string
          minLength: 1
          description: "必填，读取融辉我发布的问题件账号 ID"
        sign_account_id:
          type: string
          minLength: 1
          description: "必填，读取融辉主单签收记录账号 ID"
        days:
          type: integer
          minimum: 1
          maximum: 366
          description: "R13 查询天数；当 request_body 没有显式 start/end 时必须提供"
        source_start:
          type: string
          description: "可选，问题件和签收的权威回溯起点；不填则从已观测账本/到货/R13 最早日期计算"
        source_end:
          type: string
          description: "可选，问题件和签收查询终点；必须与 source_start 配合且不能晚于本轮观测时间"
        problem_page_size:
          type: integer
          minimum: 1
          maximum: 200
        problem_max_pages:
          type: integer
          minimum: 1
          maximum: 5000
        problem_retry_attempts:
          type: integer
          minimum: 1
          maximum: 5
        problem_timeout_sec:
          type: integer
          minimum: 30
          maximum: 7200
        sign_page_size:
          type: integer
          minimum: 1
          maximum: 200
        sign_max_pages:
          type: integer
          minimum: 1
          maximum: 5000
        sign_chunk_days:
          type: integer
          minimum: 1
          maximum: 366
        sign_retry_attempts:
          type: integer
          minimum: 1
          maximum: 5
        sign_timeout_sec:
          type: integer
          minimum: 30
          maximum: 7200
        waybill_timeout_sec:
          type: integer
          description: "可选，补齐地址的详情查询超时时间，默认 2400 秒"
        browser_batch_size:
          type: integer
          description: "可选，浏览器补齐详情的批量大小，默认 10"
      required: [r13_account_id, problem_account_id, sign_account_id, detail_account_id]
    output_schema:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [SUCCESS, FAILED]
        data:
          type: object
          additionalProperties: true
        meta:
          type: object
          additionalProperties: true
        warnings:
          type: array
          items:
            type: string
        error:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
      required: [status, data, meta, warnings, error]
    executor: tools/daily_sign_sync_tool.py
    timeout: 2400
    heavy: false

