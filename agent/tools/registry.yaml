    description: "执行飞书协作操作（创建表格、写入数据、发送消息等）"
    input_schema:
      type: object
      additionalProperties: false
      properties:
        action:
          type: string
          description: "操作类型：create_sheet, write_records, list_records, search_records, query_records, delete_records, list_fields, create_field, create_spreadsheet, write_sheet, clear_sheet, append_sheet, read_sheet, add_sheet, send_message, upload_file, trigger_webhook"
        params:
          type: object
          description: "操作参数；支持飞书 Base/Sheets/IM 常用操作。write_records 支持 base_token(app_token 兼容) + table_id + records；search_records 使用 records/search + filter 精确筛选原始记录；query_records 使用 data-query DSL；read/write/append_sheet 使用 spreadsheet_token + range + values；add_sheet 走飞书 OpenAPI；trigger_webhook 用于触发飞书流程 webhook"
