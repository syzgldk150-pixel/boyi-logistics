tools:
  - name: query_waybill
    version: "1.0.0"
    operation_type: read
    risk_level: low
    llm_exposed: true
    approval:
      mode: none
    permissions:
      required_roles:
        - admin
    account_scope:
      required: false
      allow_implicit_default: false
    idempotency:
      mode: parameters
      key_fields: []
    retry:
      safe: true
      max_attempts: 3
    evidence:
      required: true
      required_fields:
        - source
        - observed_at
    postconditions:
      - authoritative_result_returned
    description: "根据运单号查询运单签收状态或详细信息（收件人、地址、件数、重量等）"
    input_schema:
      type: object
      additionalProperties: false
      properties:
        waybill_no:
          type: string
          description: "运单号，支持多个用逗号/空格分隔，如 YS20260401001,YS20260401002"
        query_type:
          type: string
          enum: [status, detail]
          description: "查询类型：status=签收状态速查（默认，支持批量），detail=完整运单详情（仅单号）"
      required: [waybill_no]
    output_schema:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [SUCCESS, FAILED]
        data:
          type: object
          additionalProperties: true
        meta:
          type: object
          additionalProperties: true
        warnings:
          type: array
          items:
            type: string
        error:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
      required: [status, data, meta, warnings, error]
    executor: tools/query_tool.py
    timeout: 70
    heavy: false

  - name: track_waybill
    version: "1.0.0"
    operation_type: read
    risk_level: low
    llm_exposed: true
    approval:
      mode: none
    permissions:
      required_roles:
        - admin
    account_scope:
      required: false
      allow_implicit_default: false
    idempotency:
      mode: parameters
      key_fields: []
    retry:
      safe: false
      max_attempts: 1
    evidence:
      required: true
      required_fields:
        - source
        - observed_at
    postconditions:
      - authoritative_result_returned
    description: "单号物流轨迹查询：融辉 R/RC/200 单号、韵达纯数字单号、000 专线单号统一入口"
    input_schema:
      type: object
      additionalProperties: false
      properties:
        tracking_number:
          type: string
          description: "要查询的单号，如 R00014513348、977808459"
        provider:
          type: string
          enum: [ronghui, yunda, zhuanxian]
          description: "可选，指定物流系统；不传时按单号自动识别"
      required: [tracking_number]
    output_schema:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [SUCCESS, FAILED]
        data:
          type: object
          additionalProperties: true
        meta:
          type: object
          additionalProperties: true
        warnings:
          type: array
          items:
            type: string
        error:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
      required: [status, data, meta, warnings, error]
    executor: tools/track_waybill_tool.py
    timeout: 210
    heavy: false

  - name: tms_query
    version: "1.0.0"
    operation_type: read
    risk_level: medium
    llm_exposed: false
    approval:
      mode: none
    permissions:
      required_roles:
        - admin
    account_scope:
      required: false
      allow_implicit_default: false
    idempotency:
      mode: parameters
      key_fields: []
    retry:
      safe: false
      max_attempts: 1
    evidence:
      required: true
      required_fields:
        - source
        - observed_at
    postconditions:
      - authoritative_result_returned
    description: "仅供旧兼容 API 使用的 TMS 只读端点白名单；写端点必须使用独立受治理工具"
    input_schema:
      type: object
      additionalProperties: false
      properties:
        endpoint:
          type: string
          enum:
            - /delivery_status
            - /get_price
            - /query_waybill_detail
            - /ronghui_tms_tracking
            - /tracking_query
            - /waybill_tracking
            - /yunda_price
            - /yunda_waybill_tracking
          description: "固定只读兼容端点；不接受任何写入或同步 target"
        params:
          type: object
          description: "请求参数"
      required: [endpoint]
    output_schema:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [SUCCESS, FAILED]
        data:
          type: object
          additionalProperties: true
        meta:
          type: object
          additionalProperties: true
        warnings:
          type: array
          items:
            type: string
        error:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
      required: [status, data, meta, warnings, error]
    executor: tools/tms_tool.py
    timeout: 60
    heavy: false

  - name: get_price
    version: "1.0.0"
    operation_type: read
    risk_level: low
    llm_exposed: true
    approval:
      mode: none
    permissions:
      required_roles:
        - admin
    account_scope:
      required: false
      allow_implicit_default: false
    idempotency:
      mode: parameters
      key_fields: []
    retry:
      safe: false
      max_attempts: 1
    evidence:
      required: true
      required_fields:
        - source
        - observed_at
    postconditions:
      - authoritative_result_returned
    description: "查询物流报价。默认走 Agent /tms/get_price；兼容旧版发站/到站/重量查询"
    input_schema:
      type: object
      additionalProperties: false
      properties:
        address:
          type: string
          description: "优先使用：完整收货地址，如 浙江省杭州市西湖区文三路100号"
        from_station:
          type: string
          description: "兼容旧版：发站名称"
        to_station:
          type: string
          description: "兼容旧版：到站名称"
        weight:
          type: number
          description: "重量(kg)"
        volume:
          type: number
          description: "可选：体积(m³)，默认 0.1"
        account_id:
          type: string
          description: "可选：账号管理中的融辉报价账号 ID；飞书直达报价默认使用 price_default"
      required: [weight]
    output_schema:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [SUCCESS, FAILED]
        data:
          type: object
          additionalProperties: true
        meta:
          type: object
          additionalProperties: true
        warnings:
          type: array
          items:
            type: string
        error:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
      required: [status, data, meta, warnings, error]
    executor: tools/price_tool.py
    timeout: 60
    heavy: true

  - name: ocr_recognize
