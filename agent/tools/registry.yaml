    input_schema:
      type: object
      additionalProperties: false
      properties:
        platform:
          type: string
          enum: [ronghui, yunda]
        account_id: {type: string, minLength: 1, maxLength: 128}
        account_label: {type: string, maxLength: 200}
        payload:
          oneOf:
            - type: object
              additionalProperties: false
              properties:
                bill_code: {type: string, minLength: 1, maxLength: 100}
                problem_type: {type: string, minLength: 1, maxLength: 100}
                owner_problem_type: {type: string, minLength: 1, maxLength: 100}
                notice_site_code: {type: string, minLength: 1, maxLength: 100}
                notice_site: {type: string, minLength: 1, maxLength: 200}
                problem_cause: {type: string, minLength: 1, maxLength: 4000}
              required:
                [bill_code, problem_type, owner_problem_type, notice_site_code, notice_site, problem_cause]
            - type: object
              additionalProperties: false
              properties:
                ship_no: {type: string, minLength: 1, maxLength: 100}
                classes_type: {type: string, minLength: 1, maxLength: 100}
                prob_text: {type: string, minLength: 1, maxLength: 4000}
                site_id:
                  type: array
                  minItems: 1
                  maxItems: 20
                  uniqueItems: true
                  items: {type: string, minLength: 1, maxLength: 100}
