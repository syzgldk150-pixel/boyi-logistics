  - name: query_business_finance
    version: "1.0.0"
    operation_type: read
    risk_level: low
    llm_exposed: false
    approval:
      mode: none
    permissions:
      required_roles:
        - admin
    account_scope:
      mode: none
      allow_implicit_default: false
    idempotency:
      mode: parameters
      key_fields: []
    retry:
      safe: true
      max_attempts: 3
    evidence:
      required: true
      required_fields:
        - source
        - observed_at
    postconditions:
      - authoritative_result_returned
    description: "查询已验证共享财务账本的期间收入、支出和净变动；不接受 SQL 或任意数据源"
    input_schema:
      type: object
      additionalProperties: false
      properties:
        start_date:
          type: string
          minLength: 10
          maxLength: 10
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: "查询起始日期，格式 YYYY-MM-DD"
        end_date:
          type: string
          minLength: 10
          maxLength: 10
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: "查询结束日期，格式 YYYY-MM-DD"
        platform:
          type: string
          enum: [ronghui]
          description: "可选，仅查询已启用的财务来源"
      required: [start_date, end_date]
    output_schema:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [SUCCESS, FAILED]
        data:
          type: object
          additionalProperties: false
          properties:
            query_type:
              type: string
              enum: [finance_summary]
            availability:
              type: string
              enum: [DATA, NO_DATA]
            period:
              type: object
              additionalProperties: false
              properties:
                start_date:
                  type: string
                end_date:
                  type: string
              required: [start_date, end_date]
            summary:
              type: object
              additionalProperties: false
              properties:
                total_income:
                  type: string
                total_expense:
                  type: string
                net_change:
                  type: string
                pending_fee_items:
                  type: integer
                  minimum: 0
            source:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                platform:
                  type: string
                validation_status:
                  type: string
                data_through_date:
                  type: string
                latest_success_at:
                  type: string
              required: [name, platform, validation_status, data_through_date, latest_success_at]
            record_count:
              type: integer
              minimum: 0
            warnings:
              type: array
              items:
                type: string
          required: [query_type, availability, period, summary, source, record_count, warnings]
        meta:
          type: object
          additionalProperties: true
        warnings:
          type: array
          items:
            type: string
        error:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
      required: [status, data, meta, warnings, error]
    executor: tools/business_finance_query_tool.py
    timeout: 30
    heavy: false

  - name: query_automation_operations
    version: "1.1.0"
    operation_type: read
    risk_level: low
    llm_exposed: true
    approval:
      mode: none
    permissions:
      required_roles:
        - admin
    account_scope:
      mode: none
      allow_implicit_default: false
    idempotency:
      mode: parameters
      key_fields: []
    retry:
      safe: true
      max_attempts: 3
    evidence:
      required: true
      required_fields:
        - source
        - observed_at
    postconditions:
      - authoritative_result_returned
    description: "按中国业务日期查询当前 Invocation 的执行状态计数、终态成功率与新鲜度；未知写计入非成功终态，不混入历史 Command/Run，不接受 SQL 或任意筛选条件"
    input_schema:
      type: object
      additionalProperties: false
      properties:
        start_date:
          type: string
          minLength: 10
          maxLength: 10
          pattern: '^\d{4}-\d{2}-\d{2}$'
        end_date:
          type: string
          minLength: 10
          maxLength: 10
          pattern: '^\d{4}-\d{2}-\d{2}$'
      required: [start_date, end_date]
    output_schema:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [SUCCESS, FAILED]
        data:
          type: object
          additionalProperties: false
          properties:
            query_type:
              type: string
              enum: [automation_operations]
            record_source:
              type: string
              enum: [automation_plugin_invocations]
            availability:
              type: string
              enum: [DATA, NO_DATA]
            period:
              type: object
              additionalProperties: false
              properties:
                start_date: {type: string}
                end_date: {type: string}
              required: [start_date, end_date]
            invocations:
              type: object
              additionalProperties: false
              properties:
                status_counts:
                  type: object
                  additionalProperties: false
                  properties:
                    STARTING: {type: integer, minimum: 0}
                    RUNNING: {type: integer, minimum: 0}
                    CANCELLING: {type: integer, minimum: 0}
                    COMPLETED: {type: integer, minimum: 0}
                    FAILED: {type: integer, minimum: 0}
                    CANCELLED: {type: integer, minimum: 0}
                    WRITE_OUTCOME_UNKNOWN: {type: integer, minimum: 0}
                total: {type: integer, minimum: 0}
                success_rate:
                  oneOf:
                    - type: "null"
                    - type: object
                      additionalProperties: false
                      properties:
                        completed_invocations: {type: integer, minimum: 0}
                        terminal_invocations: {type: integer, minimum: 1}
                        value: {type: string, pattern: '^(0\.\d{4}|1\.0000)$'}
                      required: [completed_invocations, terminal_invocations, value]
              required: [status_counts, total, success_rate]
            freshness:
              type: object
              additionalProperties: false
              properties:
                latest_invocation_started_at:
                  oneOf: [{type: string}, {type: "null"}]
                latest_invocation_updated_at:
                  oneOf: [{type: string}, {type: "null"}]
              required: [latest_invocation_started_at, latest_invocation_updated_at]
          required: [query_type, record_source, availability, period, invocations, freshness]
        meta:
          type: object
          additionalProperties: true
        warnings:
          type: array
          items: {type: string}
        error:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
      required: [status, data, meta, warnings, error]
    executor: tools/automation_operations_query_tool.py
    timeout: 30
    heavy: false

