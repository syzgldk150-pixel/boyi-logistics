[project]
name = "boyi-logistics"
version = "0.1.0"
description = "Private logistics automation monorepo"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["agent/price_scripts", "tmp", "runtime"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
