<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>登录后台 - {{ app_title | default('物流 Agent 控制台') }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="preload" href="/static/assets/fonts/InterVariable-Latin.woff2?v=4f95b56c" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/assets/fonts/SourceHanSansCN-UI.woff2?v=27533854" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/style.css?v=cal-console-20260821-plugin-manager1">
</head>
<body class="login-page">
  <main class="login-shell">
    <aside class="login-context" aria-label="控制台功能说明">
      <div class="login-context__inner">
        <span class="login-context__mark" aria-hidden="true"><i data-feather="truck"></i></span>
        <p class="login-context__label">博益物流控制台</p>
        <h2>集中处理运单、回单、客服与自动化任务。</h2>
        <ul class="login-context__list">
          <li><i data-feather="check"></i><span>查询真实业务状态与处理结果</span></li>
          <li><i data-feather="check"></i><span>在桌面与移动端完成核心操作</span></li>
          <li><i data-feather="check"></i><span>统一管理后台与业务账号</span></li>
        </ul>
      </div>
    </aside>
    <section class="login-panel" aria-labelledby="login-title" data-reveal="main">
      <div class="login-brand"><img src="/static/assets/boyi-logistics-logo-7e1f2994.webp" width="216" height="62" alt="博益物流"></div>
      <div class="login-heading">
        <p class="kicker">安全访问</p>
        <h1 id="login-title">登录后台</h1>
        <p>请输入管理员账号和密码进入控制台。</p>
      </div>
      {% if message %}
      <div class="notice notice--{{ message_kind or 'info' }}" data-notice role="alert"><div class="notice-copy"><i data-feather="info"></i><span>{{ message }}</span></div></div>
      {% endif %}
      {% if not has_admin_users %}
      <div class="notice notice--warning" role="alert"><div class="notice-copy"><i data-feather="alert-triangle"></i><span>尚未初始化管理员账号。请先配置 DOCFLOW_ADMIN_USERNAME 和 DOCFLOW_ADMIN_PASSWORD 后重启后台。</span></div></div>
      {% endif %}
      <form class="login-form" action="/login" method="post" autocomplete="on" data-ui-submit>
        <input type="hidden" name="next" value="{{ next_url or '/' }}">
        <label><span>账号</span><input class="review-input" type="text" name="username" value="{{ username_value or '' }}" autocomplete="username" required autofocus></label>
        <label><span>密码</span><input class="review-input" type="password" name="password" autocomplete="current-password" required></label>
        <button class="primary-btn login-submit" type="submit"><i data-feather="log-in"></i><span>登录后台</span></button>
      </form>
    </section>
  </main>
  <script src="/static/vendor/feather-4.29.2.min.js"></script>
  <script src="/static/console_ui.js?v=cal-console-20260815-tabs2"></script>
  <script>feather.replace();</script>
</body>
</html>
