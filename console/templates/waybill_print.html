<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>打印运单 {{ waybill.get("waybill_no", "") }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --paper-w: 74mm;
      --paper-h: 92mm;
      --font: "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei", SimHei, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #f3f4f6; color: #000; font-family: var(--font); }
    body { display: flex; flex-direction: column; align-items: center; padding: 18px; }
    .print-toolbar { width: min(var(--paper-w), calc(100vw - 24px)); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .print-toolbar a, .print-toolbar button { display: inline-flex; align-items: center; justify-content: center; min-height: 36px; padding: 0 12px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; color: #111827; font: 600 13px var(--font); text-decoration: none; cursor: pointer; }
    .print-status { flex: 1 1 100%; color: #4b5563; font: 600 12px var(--font); }
    .print-frame { width: var(--paper-w); height: var(--paper-h); background: #fff; box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12); }
    .print-frame .ys-waybill-label { display: block; width: 74mm; height: 92mm; }
    @media print {
      @page { size: 74mm 92mm; margin: 0; }
      html, body { width: 74mm; height: 92mm; background: #fff; padding: 0; overflow: hidden; }
      body { display: block; }
      .no-print { display: none !important; }
      .print-frame { width: 74mm; height: 92mm; box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="print-toolbar no-print">
    <a href="/ocr">返回录单</a>
    <span class="print-status" data-print-status>优先使用 C-Lodop 打印服务</span>
    <button type="button" onclick="previewWaybill()">打印预览</button>
    <button type="button" onclick="printWaybill()">打印</button>
  </div>

  <div class="print-frame" data-waybill-label-preview></div>

  <script src="/static/js/waybill_label_html.js"></script>
  <script src="/static/js/waybill_label_lodop.js"></script>
  <script src="/static/js/clodop_loader.js?v=20260812"></script>
  <script>
    const PRINT_SETTINGS_KEY = "shipnow.manual.printerSettings";

    function setPrintStatus(message) {
      const target = document.querySelector("[data-print-status]");
      if (target) target.textContent = message;
    }

    function describePrintError(error) {
      if (error instanceof Error) return error.message || error.name || "";
      return String(error || "");
    }

    function isLocalOriginHost(host) {
      return ["localhost", "127.0.0.1", "::1", "[::1]"].includes(String(host || "").toLowerCase());
    }

    function isPublicHttpOrigin() {
      return window.location.protocol === "http:" && !isLocalOriginHost(window.location.hostname);
    }

    function formatCLODOPLoadErrors() {
      return (window.BoyiCLodop?.getLoadErrors() || []).slice(-3).join("；");
    }

    function formatPrintError(error) {
      const detail = describePrintError(error);
      if (detail.includes("C-Lodop service not found")) {
        const errorHistory = formatCLODOPLoadErrors();
        const publicHttpHint = isPublicHttpOrigin()
          ? "当前通过公网 HTTP 地址打开后台，Chrome 可能会阻止页面连接本机 C-Lodop；若仍失败，请在 Chrome 中允许该网站访问本地网络。"
          : "";
        if (errorHistory) return `未连接到 C-Lodop 打印服务，已尝试 ${errorHistory}。${publicHttpHint}`;
        return publicHttpHint || "未连接到 C-Lodop 打印服务。";
      }
      if (detail.includes("Waybill Lodop renderer not loaded")) {
        return "面单打印模板未加载，请刷新页面后重试。";
      }
      if (detail.includes("Waybill label background load failed")) {
        return `面单底版加载失败：${detail}。`;
      }
      if (detail.includes("Failed to fetch")) {
        return "面单底版加载失败：浏览器无法读取面单底版资源，请刷新页面后重试。";
      }
      return `打印失败：${detail || "未知错误"}`;
    }

    function readPrintSettings() {
      try {
        return JSON.parse(localStorage.getItem(PRINT_SETTINGS_KEY) || "{}") || {};
      } catch {
        return {};
      }
    }

    async function getCLodopInstance() {
      if (!window.BoyiCLodop?.getInstance) throw new Error("C-Lodop loader not available");
      return window.BoyiCLodop.getInstance();
    }

    function findPrinterIndex(lodop, printerName) {
      const wanted = String(printerName || "").trim();
      if (!wanted || wanted === "系统默认打印机") return null;
      const count = Number(lodop.GET_PRINTER_COUNT?.() || 0);
      for (let index = 0; index < count; index += 1) {
        if (String(lodop.GET_PRINTER_NAME(index) || "") === wanted) {
          return index;
        }
      }
      return null;
    }

    const WAYBILL_LABEL_WIDTH = "74mm";
    const WAYBILL_LABEL_HEIGHT = "92mm";
    const WAYBILL_PRINT_DATA = {
      waybill_no: {{ (waybill.get("waybill_no", "") or "") | tojson }},
      open_date: {{ (waybill.get("open_date", "") or "") | tojson }},
      destination_site: {{ (waybill.get("destination_site", "") or "") | tojson }},
      receiver_name: {{ (waybill.get("receiver_name", "") or "") | tojson }},
      receiver_phone: {{ (waybill.get("receiver_phone", "") or "") | tojson }},
      receiver_address: {{ (waybill.get("receiver_address", "") or "") | tojson }},
      sender_name: {{ (waybill.get("sender_name", "") or "") | tojson }},
      sender_phone: {{ (waybill.get("sender_phone", "") or "") | tojson }},
      goods_name_lines: {{ (waybill.get("goods_name_lines", "") or "") | tojson }},
      package_type_lines: {{ (waybill.get("package_type_lines", "") or "") | tojson }},
      quantity_lines: {{ (waybill.get("quantity_lines", "") or "") | tojson }},
      weight_volume: {{ (waybill.get("weight_volume", "") or "") | tojson }},
      delivery_method: {{ (waybill.get("delivery_method", "") or "") | tojson }},
      freight_fee: {{ (waybill.get("freight_fee", "") or "") | tojson }},
      delivery_fee: {{ (waybill.get("delivery_fee", "") or "") | tojson }},
      payment_method: {{ (waybill.get("payment_method", "") or "") | tojson }},
      insurance_amount: {{ (waybill.get("insurance_amount", "") or "") | tojson }},
      cod_amount: {{ (waybill.get("cod_amount", "") or "") | tojson }},
      remark: {{ (waybill.get("remark", "") or "") | tojson }},
    };

    window.addEventListener("DOMContentLoaded", () => {
      window.WaybillLabelHtml?.renderPreview?.("[data-waybill-label-preview]", WAYBILL_PRINT_DATA, readPrintSettings())
        .catch((error) => {
          console.error("Waybill label preview render failed", error);
          setPrintStatus("面单模板加载失败，无法预览或打印");
        });
    });

    function openLodopPreview(lodop) {
      if (typeof lodop.SET_PREVIEW_WINDOW === "function") {
        lodop.SET_PREVIEW_WINDOW(1, 0, 0, 760, 680, "打印预览.打印");
      }
      lodop.PREVIEW();
    }

    async function applyWaybillLodopTemplate(lodop, wb, settings = {}) {
      if (!window.WaybillLabelLodop?.applyTemplate) throw new Error("Waybill Lodop renderer not loaded");
      await window.WaybillLabelLodop.applyTemplate(lodop, wb, settings);
    }

    async function runWaybillPrint(mode) {
      const settings = readPrintSettings();
      const copies = Math.max(1, Math.min(Number(settings.print_copies || 1) || 1, 5));
      document.documentElement.style.setProperty("--paper-w", WAYBILL_LABEL_WIDTH);
      document.documentElement.style.setProperty("--paper-h", WAYBILL_LABEL_HEIGHT);
      try {
        const lodop = await getCLodopInstance();
        if (!lodop) throw new Error("C-Lodop service not found");
        const printerIndex = findPrinterIndex(lodop, settings.printer_name);
        lodop.PRINT_INIT(`博益物流运单 {{ waybill.get("waybill_no", "") }}`);
        if (printerIndex !== null) lodop.SET_PRINTER_INDEX(printerIndex);
        lodop.SET_PRINT_COPIES(copies);
        await applyWaybillLodopTemplate(lodop, WAYBILL_PRINT_DATA, settings);
        if (mode === "preview") {
          openLodopPreview(lodop);
          setPrintStatus("已打开 C-Lodop 打印预览");
        } else {
          lodop.PRINT();
          setPrintStatus("已提交到 C-Lodop 打印服务");
        }
      } catch (error) {
        console.error("C-Lodop print failed", error);
        setPrintStatus(formatPrintError(error));
      }
    }

    function printWaybill() {
      return runWaybillPrint("print");
    }

    function previewWaybill() {
      return runWaybillPrint("preview");
    }

    window.printWaybill = printWaybill;
    window.previewWaybill = previewWaybill;
    {% if print_preview %}
    window.addEventListener("load", () => {
      window.setTimeout(() => previewWaybill(), 220);
    });
    {% elif autoprint %}
    window.addEventListener("load", () => {
      window.setTimeout(() => printWaybill(), 220);
    });
    {% endif %}
  </script>
</body>
</html>
