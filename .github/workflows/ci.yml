name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  agent-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: agent_control_plane_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      PYTHONPATH: ${{ github.workspace }}/agent:${{ github.workspace }}
      PYTHON_DOTENV_DISABLED: "1"
      RUN_MYSQL_INTEGRATION: "1"
      AGENT_DB_HOST: 127.0.0.1
      AGENT_DB_PORT: "3306"
      AGENT_DB_USER: root
      AGENT_DB_PASS: ""
      AGENT_DB_NAME: agent_control_plane_test
      MIGRATION_ENV_FILE: /dev/null
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install shared production locks and Agent quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r agent/requirements.lock -r console/requirements.lock
          python agent/scripts/verify_locked_environment.py agent/requirements.lock
          python agent/scripts/verify_locked_environment.py console/requirements.lock
          python -m pip install ruff==0.16.2 pytest==9.1.1
      - name: Compile source
        run: python -m compileall -q agent shared tests
      - name: Lint high-confidence errors
        run: ruff check agent shared tests
      - name: Validate tool registry
        run: python agent/scripts/validate_tool_registry.py
      - name: Guard runtime import boundaries
        run: python agent/scripts/check_runtime_import_boundaries.py
      - name: Guard repository hygiene
        run: python agent/scripts/check_repository_hygiene.py
      - name: Guard internal API contracts
        run: python agent/scripts/check_internal_api_contracts.py
      - name: Test
        run: |
          pytest -q tests
          pytest -q agent/tests

  console-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHON_DOTENV_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Console lock and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r console/requirements.lock
          python agent/scripts/verify_locked_environment.py console/requirements.lock
          python -m pip install ruff==0.16.2 pytest==9.1.1
      - name: Compile source
        run: python -m compileall -q console shared
      - name: Lint high-confidence errors
        run: ruff check console shared
      - name: Test Console
        run: pytest -q console/tests
