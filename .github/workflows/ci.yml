name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  agent-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: agent_control_plane_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      PYTHONPATH: ${{ github.workspace }}/agent:${{ github.workspace }}
      PYTHON_DOTENV_DISABLED: "1"
      RUN_MYSQL_INTEGRATION: "1"
      AGENT_DB_HOST: 127.0.0.1
      AGENT_DB_PORT: "3306"
      AGENT_DB_USER: root
      AGENT_DB_PASS: ""
      AGENT_DB_NAME: agent_control_plane_test
      MIGRATION_ENV_FILE: /dev/null
    steps:
      - uses: actions/checkout@v4
      - name: Install restricted Harness sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes apparmor apparmor-profiles bubblewrap patchelf util-linux
          sudo apparmor_parser -r \
            /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          bwrap --unshare-all --die-with-parent \
            --ro-bind / / /usr/bin/true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install trusted system Python for offline plugin execution
        run: |
          # Materialize the setup-python runtime at the simulator's existing
          # trusted system path; the sandbox intentionally does not mount /opt.
          sudo -- "$(command -v python)" -I - <<'PY'
          from pathlib import Path
          import shutil
          import sys

          assert sys.version_info[:2] == (3, 10)
          source = Path(sys.base_prefix).resolve()
          destination = Path("/usr/local")
          executable = destination / "bin/python3.10"
          assert not executable.is_symlink()
          shutil.copy2(Path(sys.executable).resolve(), executable)
          shutil.copytree(
              source / "lib/python3.10",
              destination / "lib/python3.10",
              dirs_exist_ok=True,
              ignore=shutil.ignore_patterns("site-packages", "__pycache__"),
          )
          libraries = list((source / "lib").glob("libpython3.10.so*"))
          assert libraries, "setup-python must provide the Python shared library"
          for library in libraries:
              shutil.copy2(library.resolve(), destination / "lib" / library.name)
          PY
          # Every subsequent test uses this real venv, so the Agent and the
          # offline simulator agree on the same trusted /usr/local base prefix.
          sudo patchelf --set-rpath /usr/local/lib /usr/local/bin/python3.10
          ci_runtime="$RUNNER_TEMP/boyi-ci-venv"
          /usr/local/bin/python3.10 -m venv --copies "$ci_runtime"
          probe='import ctypes, encodings, json, sqlite3, ssl, sys, venv, zlib; assert sys.version_info[:2] == (3, 10); assert sys.flags.isolated; assert sys.base_prefix == "/usr/local"; assert sys.prefix != sys.base_prefix; assert not any(path.startswith("/opt/") for path in sys.path); print(json.dumps({"version": sys.version, "prefix": sys.prefix, "base_prefix": sys.base_prefix}))'
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 \
            "$ci_runtime/bin/python" -I -c "$probe"
          bwrap --unshare-all --die-with-parent --new-session --clearenv \
            --ro-bind /usr /usr --ro-bind /bin /bin \
            --ro-bind /lib /lib --ro-bind /lib64 /lib64 \
            --ro-bind "$ci_runtime" /ci-runtime \
            --proc /proc --dev /dev --tmpfs /tmp --chdir /tmp \
            --setenv PATH /usr/bin:/bin --setenv LANG C.UTF-8 \
            /ci-runtime/bin/python -I -c "$probe"
          printf '%s\n' "$ci_runtime/bin" >> "$GITHUB_PATH"
      - name: Install shared production locks and Agent quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r agent/requirements.lock -r console/requirements.lock
          python agent/scripts/verify_locked_environment.py agent/requirements.lock
          python agent/scripts/verify_locked_environment.py console/requirements.lock
          python -m pip install ruff==0.16.2 pytest==9.1.1
      - name: Install real Chromium for direct plugin acceptance
        run: |
          python -m playwright install --with-deps chromium
          python - <<'PY'
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          with sync_playwright() as playwright:
              executable = Path(playwright.chromium.executable_path)
          assert executable.is_absolute() and executable.is_file()
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(f"V32_CHROMIUM_EXECUTABLE={executable}\n")
          PY
      - name: Compile source
        # The helper preserves the former windows_worker($|/) boundary together
        # with --exclude agent/agent/windows_worker and the two collection rules
        # --ignore-glob='tests/test_windows_worker_*.py'
        # --ignore-glob='agent/tests/test_windows_worker_*.py'.
        run: |
          mapfile -d '' -t quality_files < <(
            python agent/scripts/first_party_release_scope.py \
              quality-files --scope gate --null
          )
          test "${#quality_files[@]}" -gt 0
          python -m py_compile "${quality_files[@]}"
      - name: Lint high-confidence errors
        run: |
          mapfile -d '' -t quality_files < <(
            python agent/scripts/first_party_release_scope.py \
              quality-files --scope gate --null
          )
          test "${#quality_files[@]}" -gt 0
          ruff check "${quality_files[@]}"
      - name: Validate tool registry
        run: python agent/scripts/validate_tool_registry.py
      - name: Guard runtime import boundaries
        run: python agent/scripts/check_runtime_import_boundaries.py
      - name: Guard repository hygiene
        run: python agent/scripts/check_repository_hygiene.py
      - name: Guard documentation contracts
        run: python agent/scripts/check_documentation.py
      - name: Guard internal API contracts
        run: python agent/scripts/check_internal_api_contracts.py
      - name: Test
        run: |
          mapfile -d '' -t root_tests < <(
            python agent/scripts/first_party_release_scope.py \
              test-files --scope gate --suite root --null
          )
          mapfile -d '' -t agent_tests < <(
            python agent/scripts/first_party_release_scope.py \
              test-files --scope gate --suite agent --null
          )
          test "${#root_tests[@]}" -gt 0
          test "${#agent_tests[@]}" -gt 0
          pytest -q "${root_tests[@]}"
          pytest -q "${agent_tests[@]}"
      - name: Audit deferred first-party source without gating this release
        # BLOCKED action extraction remains visible, but cannot veto a signed
        # release whose payload does not contain those source trees.
        continue-on-error: true
        run: |
          mapfile -d '' -t deferred_files < <(
            python agent/scripts/first_party_release_scope.py \
              quality-files --scope deferred --null
          )
          if [ "${#deferred_files[@]}" -gt 0 ]; then
            python -m py_compile "${deferred_files[@]}"
            ruff check "${deferred_files[@]}"
          fi
          mapfile -d '' -t deferred_tests < <(
            python agent/scripts/first_party_release_scope.py \
              test-files --scope deferred --suite root --null
          )
          if [ "${#deferred_tests[@]}" -gt 0 ]; then
            pytest -q "${deferred_tests[@]}"
          fi

  console-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHON_DOTENV_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Console lock and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r console/requirements.lock
          python agent/scripts/verify_locked_environment.py console/requirements.lock
          python -m pip install ruff==0.16.2 pytest==9.1.1
      - name: Compile source
        run: python -m compileall -q console shared
      - name: Lint high-confidence errors
        run: ruff check console shared
      - name: Test Console
        run: pytest -q console/tests

  windows-worker-quality:
    # Windows Worker/Tray is explicitly deferred from the current release.
    # Keep the job definition reviewable, but do not make it a release gate.
    if: ${{ false }}
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/agent;${{ github.workspace }}
      PYTHON_DOTENV_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install exact Windows Worker runtime and quality tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r agent/windows_worker_requirements.lock
          python agent/scripts/verify_locked_environment.py agent/windows_worker_requirements.lock
          python -m pip install ruff==0.16.2 pytest==9.1.1
      - name: Compile Windows Worker
        shell: pwsh
        run: python -m compileall -q agent/agent/windows_worker agent/agent/automation_plugins
      - name: Lint Windows Worker
        shell: pwsh
        run: >-
          ruff check agent/agent/windows_worker
          agent/tests/test_windows_worker_state.py
          agent/tests/test_windows_worker_transport.py
          agent/tests/test_windows_worker_service_loop.py
          agent/tests/test_windows_worker_tray_ipc.py
          agent/tests/test_windows_worker_dpapi.py
          agent/tests/test_windows_worker_configuration.py
      - name: Test Windows-specific boundaries
        shell: pwsh
        run: >-
          pytest -q
          agent/tests/test_windows_worker_state.py
          agent/tests/test_windows_worker_transport.py
          agent/tests/test_windows_worker_service_loop.py
          agent/tests/test_windows_worker_tray_ipc.py
          agent/tests/test_windows_worker_dpapi.py
          agent/tests/test_windows_worker_configuration.py
